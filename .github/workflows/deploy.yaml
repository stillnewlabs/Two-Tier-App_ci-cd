name: Ci/CD pipeline for two tier application_employee management portal
on :
  push:
   branches: 
   - main
   jobs: build and depoly the application
   runs-on: ubuntu:latest
   steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Show System Information
        run: |
          pwd
          ls -la
          whoami
          hostname
          free
          htop -t
          cat /etc/os-release
          uname -a
          lscpu
          docker --version
          docker compose version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/employee-portal-backend:latest ./backend
      - name: Frontend Image Building
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/employee-portal-frontend:latest ./frontend
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/employee-portal-backend:latest

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/employee-portal-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_ADDRESS }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PASSWORD}}

          script: |
            cd Docker-Project-
            docker compose down
            docker pull ${{ secrets.DOCKERHUB_USER }}/employee-portal-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USER }}/employee-portal-frontend:latest
            docker compose up -d 
            docker ps 


